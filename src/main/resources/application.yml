      - XLF
      - XLE
      - XLK

    # The vendor rate-limits aggressively (429 TOO_MANY_REQUESTS after only a handful of rapid
    # calls), and streaming instruments are not polled at all, so this is a backstop rather than
    # the main path.
    poll-interval: 3s
    stale-after: 15s
    history-days: 250
    streaming-enabled: true
    resubscribe-interval: 5m

  analyst:
    enabled: true
    model: claude-opus-5
    api-key: ${ANTHROPIC_API_KEY:}
    max-tool-iterations: 8
    max-tokens: 16000

logging:
  level:
    root: INFO
    dev.aperture: INFO
    # The SDK logs a full stack trace at ERROR for every failed request, including refusals that
    # Aperture handles deliberately. Quieten it so a handled 403 does not look like a crash.
    com.webull.openapi.core.http.HttpApiClient: OFF
    com.webull.openapi.core.http.initializer: WARN
    org.hibernate.orm.deprecation: ERROR
