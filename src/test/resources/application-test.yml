# Layered on top of the main application.yml by the `test` profile, which surefire activates.
# A src/test/resources/application.yml would SHADOW the main file rather than merge with it.

spring:
  datasource:
    # In-memory, per-JVM. DB_CLOSE_DELAY=-1 keeps it alive between connections within a run.
    # Note H2 rejects AUTO_SERVER=TRUE together with DB_CLOSE_ON_EXIT=FALSE.
    url: jdbc:h2:mem:aperture-test;DB_CLOSE_DELAY=-1;MODE=LEGACY
  flyway:
    enabled: true

aperture:
  webull:
    app-key: ""
    app-secret: ""
    enabled: false
    default-environment: SANDBOX
    allow-live-trading: false
  market-data:
    streaming-enabled: false
    poll-interval: 1h
  analyst:
    enabled: false
    api-key: ""

logging:
  level:
    root: WARN
    dev.aperture: WARN
